<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempFlow - Conversor de Temperatura</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <div id="logo">
    <img id="img" src="img/logo.png" alt="Logo TempFlow" width="50px">
    <h1 id="title">TempFlow</h1>
    </div>
    <main id="main">
        <div id="insert">
            <input id="input" type="number" inputmode="" placeholder="Digite a temperatura">
            <select name="unidade" id="temps">
                <option value="Vazio"></option>
                <option value="Celsius">Celsius</option>
                <option value="Kelvin">Kelvin</option>
                <option value="Fahrenheit">Fahrenheit</option>
            </select>
           
        </div>
         <button type="button" id="botao">Converter</button>
        <div id="result">
            <p id="rF"><span id="undtemp1">Fahrenheit</span><span id="resultadoF">0</span></p>

            <p id="rK"><span id="undtemp2">Kelvin</span><span id="resultadoK">0</span></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
